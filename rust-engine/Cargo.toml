[package]
name = "rust_engine"
version = "0.1.0"
edition = "2018"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow            = "1.0"
log               = "0.4"
env_logger        = "0.11.8"
libc              = "0.2"
walkdir           = "2.3"
cpal              = "0.15.3"
ffmpeg-next       = "7.1"                             # Use the default feature set (codec, format, swresample, etc.)
ffmpeg-sys-next   = { version = "7.1.2", default-features = false }
serde             = { version = "1.0", features = ["derive"] }
serde_json        = "1.0"
once_cell         = "1.17"
tungstenite       = "0.17"
tokio-tungstenite = "0.26.2"
futures           = "0.3"
tokio             = { version = "1.28", features = ["rt-multi-thread","macros","time","sync","net"] }
