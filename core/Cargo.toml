[package]
name = "media-player-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ffmpeg-next = "7.1"
ffmpeg-sys-next = "7.1.2"
cpal = "0.15.2"
tokio-tungstenite = "0.26.2"
tungstenite = "0.17"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.17"
tokio = { version = "1.28", default-features = true, features = ["rt-multi-thread", "macros", "time", "sync", "net"] }

[[bin]]
name = "media-player-core-bin"
path = "src/main.rs"
